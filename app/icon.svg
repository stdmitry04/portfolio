<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Import the Cormorant Garamond font directly from Google Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;display=swap');
      .favicon-text {
        font-family: 'Cormorant Garamond', 'Georgia', serif;
        font-size: 18px;
        font-weight: 600;
        fill: #F3F4F6; /* Crisp off-white */
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- Smooth rounded square background (Optional: remove if you want a transparent background) -->
  <rect width="32" height="32" rx="6" fill="#111827" />
  
  <!-- Centered DS text -->
  <text x="16" y="15.5" class="favicon-text">DS</text>
</svg>
